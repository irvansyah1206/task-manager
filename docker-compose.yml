services:
  # 1. Database PostgreSQL
  db:
    image: postgres:15
    container_name: taskmanager-db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # 2. Redis Caching
  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    ports:
      - "6379:6379"

  # 3. Apache Kafka (KRaft Mode - Tanpa Zookeeper agar hemat RAM)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: taskmanager-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # 4. S3Mock (Alternatif S3 yang stabil & ringan)
  s3mock:
    image: adobe/s3mock:latest
    container_name: taskmanager-s3mock
    ports:
      - "9090:9090"
    environment:
      - initialBuckets=my-bucket-name

  # 5. Elasticsearch (Limitasi RAM agar tidak crash)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: taskmanager-elasticsearch
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  # 6. Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: taskmanager-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # 7. Jenkins (Optional - matikan jika tidak sedang butuh CI/CD)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: taskmanager-jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: